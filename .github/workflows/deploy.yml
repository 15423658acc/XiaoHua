# 构建 Vite 项目并部署到 GitHub Pages
# 触发：推送到 main 或 master 分支
# 部署地址：https://<username>.github.io/<repo-name>/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build
        env:
          GITHUB_ACTIONS: true
        run: npm run build

      # enablement: true —— 若仓库尚未启用 Pages，自动启用
      # 注意：若已启用但 Source 是 "Deploy from a branch"，本参数不会改写已有配置，
      # 需要手动到 Settings → Pages → Source 改为 "GitHub Actions"
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
